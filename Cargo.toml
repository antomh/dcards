[package]
name = "dcards"
version = "0.1.0"
edition = "2021"
description = "A flashcard dictionary for Linux"
license = "MIT"
publish = false

[dependencies]
# GUI. X11-only for the MVP; the Wayland backend is intentionally disabled.
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "=0.29.1"
egui_extras = "=0.29.1"

# Async runtime, used only for LLM HTTP requests (stage 3+).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization: config, LLM API, import.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Tray. The default `libappindicator` backend talks the StatusNotifierItem
# protocol and uses libayatana-appindicator3 when available. The pure-Rust
# `ksni` backend is an alternative for hosts without the AppIndicator
# development packages; enable it with `tray-icon/ksni` (mutually exclusive).
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }
# Used to drive the tray's AppIndicator backend on a dedicated thread.
gtk = "0.18"
global-hotkey = "0.7"
x11-clipboard = "0.9"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
notify-rust = "4"

# Storage.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
directories = "6"
chrono = "0.4"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Misc.
crossbeam-channel = "0.5"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
